name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"
      - run: pytest --junit-xml=results.xml

      - name: the suite that pins polarity actually ran
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"{total} tests, {skipped} skipped")
          assert total >= 110, f"only {total} tests collected"
          assert skipped == 0, f"{skipped} tests skipped"
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # logbook#60: `ruff check` and `ruff format --check` are different
      # questions, and a repo that only asks the first produces a diff the
      # moment anyone runs the project's own formatter.
      - run: ruff format --check .

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      # Two things about every step in this job.
      #
      # `diff` rather than `grep`, on purpose. This whole repository is about
      # assertions that match less than they look like, and a whole-output
      # assertion written as `diff` has no substring weakness to have an
      # opinion about.
      #
      # `set +e` before each deadassert run, also on purpose. GitHub runs
      # steps under `bash -e {0}`, so -e is on before the script starts and
      # `set -uo pipefail` does not turn it off -- without `set +e` the
      # script dies on deadassert's exit 1 and never reaches `status=$?`.
      # That cost this PR a red run, which is this repository's own subject
      # arriving by the front door.
      - name: the shipped example prints exactly what the README quotes
        run: |
          set -uo pipefail
          set +e
          deadassert examples/ -q > got.txt
          status=$?
          set -e
          test "$status" -eq 1
          diff -u examples/expected-quiet.txt got.txt

      - name: --against turns the prefix finding into the stronger one
        run: |
          set -uo pipefail
          set +e
          deadassert examples/ --against examples/output.txt > got.txt
          status=$?
          set -e
          test "$status" -eq 1
          diff -u examples/expected-against.txt got.txt

      - name: every sound positive assertion in the example matches the shipped output
        run: |
          set -uo pipefail
          set +e
          deadassert examples/ --against examples/output.txt --json > out.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          found = json.load(open("out.json"))["not_matched"]
          assert found == [], f"examples/output.txt has drifted: {found}"
          PY

      # `cmd; test $? -eq N` does not survive -e either: the script is gone
      # on cmd's non-zero status before `test` is reached. Same trap as
      # above, different punctuation.
      - name: exit codes
        run: |
          set +e
          mkdir -p clean/.github/workflows  # a repo with one sound assertion
          printf \
            "'on': push\njobs:\n  j:\n    steps:\n      - run: grep -qxF 'ok' o\n" \
            > clean/.github/workflows/ci.yml

          deadassert examples/ > /dev/null;      findings=$?
          deadassert clean > /dev/null;          sound=$?
          deadassert /nonexistent > /dev/null 2>&1; nothing=$?
          set -e

          echo "findings=$findings sound=$sound nothing=$nothing"
          test "$findings" -eq 1
          test "$sound" -eq 0
          test "$nothing" -eq 2

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .

      # logbook#59: a dogfood step that runs the tool on a repository holding
      # none of its subject asserts nothing, and passes while doing it. The
      # subject here is assertions in workflow files, and this file is full of
      # them, so the step below is one of the few in the org that cannot be
      # vacuous. The denominator is asserted anyway, because that is the
      # difference between a real all-clear and an empty one.
      - name: every assertion in this repository can fail
        run: |
          set -euo pipefail
          deadassert . | tee out.txt
          grep -qxF \
            'Every assertion here fails when the thing it names stops being true.' \
            out.txt

      # Two. Not many, and worth saying out loud rather than hiding behind a
      # green tick: this file prefers `diff` and `test "$status"` to `grep`
      # wherever a whole output is being checked, which is the right thing to
      # do and also leaves this tool very little of its own subject to find.
      # The richer corpus is `examples/`, which holds one of every kind and is
      # checked by the `example` job above. What gives *this* step its teeth
      # is the mutation below, not the size of the number.
      #
      # logbook#69 is the other half of that admission, and it is now the
      # tool's own job rather than this comment's: almost every real
      # assertion in this file is a Python `assert` or a `diff`, deadassert
      # reads neither, and the `unread` count is it saying so. The assertions
      # below cannot be vacuous -- the lines they describe are in this file.
      - name: and it was measured over something, and it says what it missed
        run: |
          set -euo pipefail
          deadassert . --json > out.json
          python - <<'PY'
          import json
          d = json.load(open("out.json"))
          print(f"{d['assertions']} assertions in {d['scripts']} scripts, "
                f"{len(d['unread'])} not read in {d['unread_scripts']} of them")
          assert d["assertions"] >= 2, f"only {d['assertions']} assertions seen"
          assert d["findings"] == [], d["findings"]

          kinds = {x["kind"] for x in d["unread"]}
          assert "assert" in kinds, kinds
          assert "diff" in kinds, kinds
          assert d["unread_scripts"] >= 4, d["unread_scripts"]

          # Anchored, not a substring: this is a repository about assertions
          # that match less than they look like.
          commands = [x["command"] for x in d["unread"]]
          wanted = "diff -u examples/expected-quiet.txt"
          assert any(c.startswith(wanted) for c in commands), commands
          PY

      # logbook#73 and logbook#66, at the CLI rather than in pytest: both
      # were about what the tool does to a whole file, and both were false
      # on shapes this file does not itself contain.
      #
      # `printf` rather than a heredoc, for the reason the `exit codes` step
      # uses it: a heredoc's lines are physical lines of *this* script, so a
      # fixture written that way puts its greps into this repository's own
      # assertion count, and a fixture about dead assertions would start
      # arriving as findings against the file that built it.
      - name: the shapes logbook#73 and logbook#66 were filed for
        run: |
          set -euo pipefail
          mkdir -p shapes/.github/workflows
          printf '%s\n' \
            "'on': push" \
            "jobs:" \
            "  j:" \
            "    steps:" \
            "      - run: |" \
            "          grep -qxF 'ok' out.txt" \
            "          echo hi | grep -qxF 'ok' out.txt || {" \
            "            echo 'absent'" \
            "            exit 1" \
            "          }" \
            "          if grep -qxF 'ok' out.txt; then exit 1; fi" \
            "      - run: |" \
            "          guard() {" \
            "            grep -qF 'ok' out.txt" \
            "          }" \
            "          guard" \
            > shapes/.github/workflows/ci.yml
          deadassert shapes | tee shapes.txt
          deadassert shapes --json > shapes.json
          python - <<'PY'
          import json
          d = json.load(open("shapes.json"))

          # Three assertions read, not two: the multi-line `|| { ... }` is one
          # of them, and it used to be reported `decorative` because the
          # `exit 1` two lines down was never seen.
          assert d["findings"] == [], d["findings"]
          assert d["assertions"] == 3, d["assertions"]

          # The one-line `if ... then exit 1; fi`. Read as `decorative` until
          # `then` counted as a command separator, so the negated count is
          # what pins it.
          assert d["negated"] == 1, d["negated"]

          # The guard in the function body: declined, and said so.
          unread = [(x["kind"], x["command"]) for x in d["unread"]]
          assert unread == [("in function", "grep -qF 'ok' out.txt")], unread
          PY

      # logbook#82, and the control that goes with it. Two shapes: one where
      # the `elif` condition decides the step and one where nothing does.
      #
      # `negated` is what pins the fix. It counts `needs-no-match`, which is
      # what `elif grep -q 'B'` is -- its own `then` branch exits. On `main`
      # the walk broke on the `elif` line, the condition came out
      # `decorative`, and this number was 0. A fix that simply declined every
      # `elif` would also get the finding off 'B', so the second step is here
      # to go red if `decorative` stops being reachable through one.
      #
      # `printf` for the same reason as the two steps around it: these lines
      # are arguments, not script, so the matchers in them stay out of this
      # repository's own count.
      - name: the shapes logbook#82 was filed for
        run: |
          set -euo pipefail
          mkdir -p elifs/.github/workflows
          printf '%s\n' \
            "'on': push" \
            "jobs:" \
            "  j:" \
            "    steps:" \
            "      - run: |" \
            "          if grep -q 'A' f; then" \
            "            echo a" \
            "          elif grep -q 'B' f; then" \
            "            exit 1" \
            "          fi" \
            "      - run: |" \
            "          if grep -q 'C' f; then" \
            "            echo c" \
            "          elif grep -q 'D' f; then" \
            "            echo d" \
            "          fi" \
            > elifs/.github/workflows/ci.yml

          # Status captured rather than inherited: the control shapes are
          # real findings, so this run exits 1 by design and `set -e` would
          # end the step before a single assertion below ran.
          set +e
          deadassert elifs --json > elifs.json; status=$?
          set -e
          test "$status" -eq 1

          python - <<'PY'
          import json
          d = json.load(open("elifs.json"))
          kinds = {(f["kind"], f["pattern"]) for f in d["findings"]}

          # The false positive itself. 'B' decides its step, so no finding may
          # call it dead -- on `main` this was ("decorative", "B").
          assert ("decorative", "B") not in kinds, kinds

          # And it is read the right way round, not merely declined: `negated`
          # counts `needs-no-match` and is 0 on `main`.
          assert d["negated"] == 1, d["negated"]

          # The condition above it, gated by the `elif`: the step exits 0 when
          # 'A' misses and 'B' misses, so `needs-match` was a claim the step
          # does not make. Declined, with the either-or sentence.
          declined = {(x["where"], "either-or" in x["why"]) for x in d["undecided"]}
          assert declined == {("ci.yml:6", True)}, d["undecided"]

          # The control: `decorative` is still reachable through an `elif`.
          assert ("decorative", "C") in kinds, kinds
          assert ("decorative", "D") in kinds, kinds
          PY

      # logbook#71: a `$` with nothing after it is a regex anchor, and used to
      # send the whole assertion to `not decided` as a "shell expansion". The
      # three lines below are the three answers this has to keep apart, and
      # the first one is 9 of the organisation's 28 undecided assertions.
      #
      # `printf` and `\$` for the same reason as the step above: these lines
      # are arguments, not script, so the matchers in them stay out of this
      # repository's own count -- which the `>= 2` assertion above would
      # notice.
      - name: the shapes logbook#71 was filed for
        run: |
          set -euo pipefail
          mkdir -p dollars/.github/workflows
          printf '%s\n' \
            "'on': push" \
            "jobs:" \
            "  j:" \
            "    steps:" \
            "      - run: |" \
            "          grep -q '^  mode  *nothing\$' out.txt" \
            "          grep -qF \"\$clean\" out.txt" \
            "          grep -q 'job \`publish\` is gated on it' out.txt" \
            > dollars/.github/workflows/ci.yml
          cat dollars/.github/workflows/ci.yml
          deadassert dollars --json > dollars.json
          python - <<'PY'
          import json
          d = json.load(open("dollars.json"))

          # The trailing anchor is read: one assertion, judged, and sound.
          assert d["assertions"] == 1, d["assertions"]
          assert d["findings"] == [], d["findings"]

          # The other two are not, and for the stated reason. `$clean` has a
          # name after the `$`; the backticks are a substitution wherever they
          # appear. Both stay undecided even though the quoting here makes
          # them literal -- that is the conservatism, and it is the point.
          where = sorted(x["where"] for x in d["undecided"])
          assert where == ["ci.yml:7", "ci.yml:8"], where
          assert all("shell expansion" in x["why"] for x in d["undecided"]), d["undecided"]
          PY

      # logbook#77 and logbook#78: four control-flow shapes the tool
      # recognises and cannot decide. Each one built a sentence saying so and
      # then could not print it -- the loop condition was dropped before an
      # `Assertion` existed, and the other three were labelled `needs-match`,
      # which is live, counted, and usable as the witness that a string can
      # appear.
      #
      # `printf` and `\$` for the same reason as the two steps above: these
      # lines are arguments, not script, so the matchers in them stay out of
      # this repository's own count.
      - name: the shapes logbook#77 and logbook#78 were filed for
        run: |
          set -euo pipefail
          mkdir -p branches/.github/workflows
          printf '%s\n' \
            "'on': push" \
            "jobs:" \
            "  j:" \
            "    steps:" \
            "      - run: |" \
            "          if grep -q '^  over ssh  *nothing\$' rows.txt; then" \
            "            echo 'this bash does not source it'" \
            "          else" \
            "            grep -q '^  over ssh  *\.bashrc\$' rows.txt" \
            "          fi" \
            "      - run: |" \
            "          if grep -q 'plain row changed' rows.txt; then" \
            "            echo noted" \
            "          else" \
            "            exit 1" \
            "          fi" \
            "      - run: |" \
            "          while grep -q 'still building' status.txt; do" \
            "            sleep 1" \
            "          done" \
            "      - run: |" \
            "          if grep -q 'either way' out.txt; then" \
            "            exit 1" \
            "          else" \
            "            echo other" \
            "            exit 1" \
            "          fi" \
            "      - run: |" \
            "          if grep -q 'unterminated' out.txt; then" \
            "            exit 1" \
            > branches/.github/workflows/ci.yml
          cat branches/.github/workflows/ci.yml
          deadassert branches | tee branches.txt
          deadassert branches --json > branches.json
          python - <<'PY'
          import json
          d = json.load(open("branches.json"))

          # All four declined, each for its own stated reason. The lines
          # matter: a reason landing on the wrong one of these would still
          # give the right count.
          why = {x["where"]: x["why"] for x in d["undecided"]}
          assert sorted(why) == ["ci.yml:18", "ci.yml:22", "ci.yml:29", "ci.yml:6"], sorted(why)
          assert "one side of an either-or" in why["ci.yml:6"], why["ci.yml:6"]
          assert why["ci.yml:18"] == "the matcher is a loop condition, not a verdict", why
          assert why["ci.yml:22"] == "either branch of the `if` can fail the step", why
          assert why["ci.yml:29"] == "the `if` has no matching `fi` in this script", why

          # Six matchers in the file, four declined, so these two are the
          # ones read -- and they are the whole discrimination. Line 9 is the
          # matcher in the either-or's `else`, which is as load bearing as it
          # ever was. Line 12 is a condition whose `else` exits on its own:
          # nothing gets a say in that branch, so the condition really is the
          # verdict and `needs-match` is right. Declining line 12 as well
          # would be the easy over-correction, and it would show up here.
          assert d["assertions"] == 2, d["assertions"]
          assert d["findings"] == [], d["findings"]
          PY

      # The assertion above is only worth anything if it can go red. Break
      # one assertion in a copy of this file and check that it does.
      - name: a broken assertion in this file is caught
        run: |
          set -euo pipefail
          mkdir -p mutant/.github/workflows
          sed 's/grep -qxF/grep -qF/' .github/workflows/ci.yml \
            > mutant/.github/workflows/ci.yml
          set +e
          deadassert mutant > mutant.txt
          status=$?
          set -e
          cat mutant.txt
          test "$status" -eq 1
          grep -qF 'prefix' mutant.txt
